[package]
name = "owlscribe"
version = "0.1.0"
edition = "2021"
description = "MCP Server to translate specification PDFs (ISO, IEEE, W3C, NIST, RFCs) into standardized OWL 2 ontologies using horned-owl and McGuinness 7-step methodology."

[dependencies]
horned-owl = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
regex = "1.10"
lopdf = "0.34"
pdf-extract = "0.7"
